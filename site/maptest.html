<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map interaction test</title>
<style>
  body { margin: 0; font: 13px ui-monospace, Menlo, Consolas, monospace; background: #111; color: #eee; }
  #log { padding: 10px 12px; white-space: pre-wrap; }
  iframe { width: 390px; height: 700px; border: 1px solid #444; display: block; }
  .PASS { color: #6f6; } .FAIL { color: #f77; } .INFO { color: #99f; }
</style>
</head>
<body>
<div id="log">running…</div>
<iframe id="f" src="map.html"></iframe>
<script>
const log = [];
// Escape: the messages carry tag names like <canvas>, which would otherwise be
// injected as real elements and quietly corrupt the report.
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const say = (cls, m) => { log.push(`<span class="${cls}">${cls}</span>  ${esc(m)}`); render(); };
const render = () => { document.getElementById('log').innerHTML = log.join('\n'); };
const sleep = ms => new Promise(r => setTimeout(r, ms));

// Without these a thrown error just stops the run mid-way and the report looks
// like it merely ended early — which is exactly how a broken probe hid itself.
window.addEventListener('error', e => say('FAIL', `threw: ${e.message}`));
window.addEventListener('unhandledrejection', e =>
  say('FAIL', `rejected: ${e.reason && e.reason.message ? e.reason.message : e.reason}`));

/* Mirror the real touch sequence, including the bits that broke it:
   a couple of pixels of finger wander, pointerleave arriving with pointerup,
   and the click the browser synthesises afterwards. */
function tap(win, elm, x, y, opts = {}) {
  const wander = opts.wander ?? 2;
  const id = opts.id ?? Math.floor(Math.random() * 1000) + 2;
  const base = { bubbles: true, cancelable: true, composed: true,
                 pointerId: id, pointerType: 'touch', isPrimary: true, button: 0 };
  elm.dispatchEvent(new win.PointerEvent('pointerdown', { ...base, clientX: x, clientY: y, buttons: 1 }));
  if (wander) {
    elm.dispatchEvent(new win.PointerEvent('pointermove',
      { ...base, clientX: x + wander, clientY: y + wander, buttons: 1 }));
  }
  elm.dispatchEvent(new win.PointerEvent('pointerup',
    { ...base, clientX: x + wander, clientY: y + wander, buttons: 0 }));
  // pointerleave used to clear the drag state; fire it to prove it no longer can
  elm.dispatchEvent(new win.PointerEvent('pointerleave', { ...base, clientX: x, clientY: y, buttons: 0 }));
  elm.dispatchEvent(new win.MouseEvent('click',
    { bubbles: true, cancelable: true, composed: true, clientX: x + wander, clientY: y + wander, button: 0 }));
}

(async () => {
  const f = document.getElementById('f');
  await new Promise(r => f.addEventListener('load', r));
  const win = f.contentWindow, doc = f.contentDocument;
  await sleep(6000);   // module + data load

  const cv = doc.getElementById('cv');
  if (!cv) { say('FAIL', 'canvas not found'); return; }
  const r = cv.getBoundingClientRect();
  say('INFO', `canvas ${Math.round(r.width)}x${Math.round(r.height)} at (${Math.round(r.left)},${Math.round(r.top)})`);

  // Find a screen position that actually sits on a point, by asking the page.
  const probe = win.__testProbe;
  if (!probe) { say('FAIL', '__testProbe missing — add the debug hook to map.html'); return; }
  const spot = probe.pointScreenPos();
  if (!spot) { say('FAIL', 'no visible point to aim at'); return; }
  say('INFO', `aiming at a point at (${Math.round(spot.x)},${Math.round(spot.y)}) — ${spot.name}`);

  const drawer = () => doc.querySelector('.drawer');
  const isOpen = () => drawer() && drawer().classList.contains('open');

  // --- first tap
  tap(win, cv, r.left + spot.x, r.top + spot.y);
  await sleep(1500);
  say(isOpen() ? 'PASS' : 'FAIL', `first tap opened the drawer (open=${isOpen()})`);

  // --- close it the way a person would
  const close = doc.querySelector('.drawer .close');
  close.click();
  await sleep(2500);   // past the .2s slide plus the delayed visibility flip
  say(!isOpen() ? 'PASS' : 'FAIL', `drawer closed (open=${isOpen()})`);

  // --- the closed drawer must be inert, not merely shifted out of sight
  const bd = doc.querySelector('.drawer-backdrop');
  const cs = win.getComputedStyle(bd), ds = win.getComputedStyle(drawer());
  say(ds.pointerEvents === 'none' ? 'PASS' : 'FAIL',
      `closed drawer is not hit-testable (pointer-events=${ds.pointerEvents})`);
  say(cs.pointerEvents === 'none' ? 'PASS' : 'FAIL',
      `closed backdrop is not hit-testable (pointer-events=${cs.pointerEvents})`);
  say(drawer().inert ? 'PASS' : 'FAIL', `closed drawer is inert (inert=${drawer().inert})`);
  say(bd.inert ? 'PASS' : 'FAIL', `closed backdrop is inert (inert=${bd.inert})`);

  // elementFromPoint wants VIEWPORT coordinates; spot is canvas-relative.
  const top = doc.elementFromPoint(r.left + spot.x, r.top + spot.y);
  const tag = top ? top.tagName.toLowerCase() : 'null';
  say(tag === 'canvas' ? 'PASS' : 'FAIL', `a tap over the map lands on the canvas (got <${tag}>)`);

  // The worst case the fix targets: the panel sitting just off the right edge.
  const offRight = doc.elementFromPoint(r.left + r.width - 3, r.top + 40);
  say('INFO', `element just inside the map's right edge: <${offRight ? offRight.tagName.toLowerCase() : 'null'}>`);
  say('INFO', `probe state: ${JSON.stringify(probe.state())}`);

  // --- second tap on the same point
  const spot2 = probe.pointScreenPos();
  say('INFO', `second aim: ${spot2 ? Math.round(spot2.x) + ',' + Math.round(spot2.y) : 'none'}`);
  tap(win, cv, r.left + (spot2 ? spot2.x : spot.x), r.top + (spot2 ? spot2.y : spot.y));
  await sleep(1500);
  say(isOpen() ? 'PASS' : 'FAIL', `second tap re-opened the drawer (open=${isOpen()})  <-- the reported bug`);

  // --- and a third, to be sure it is not just alternating
  doc.querySelector('.drawer .close').click();
  await sleep(900);
  const spot3 = probe.pointScreenPos();
  tap(win, cv, r.left + spot3.x, r.top + spot3.y);
  await sleep(1200);
  say(isOpen() ? 'PASS' : 'FAIL', `third tap re-opened the drawer (open=${isOpen()})`);

  // --- a drag must NOT be read as a tap
  doc.querySelector('.drawer .close').click();
  await sleep(900);
  const s4 = probe.pointScreenPos();
  tap(win, cv, r.left + s4.x, r.top + s4.y, { wander: 60 });
  await sleep(900);
  say(!isOpen() ? 'PASS' : 'FAIL', `a drag across the map does not open the panel (open=${isOpen()})`);

  // --- the ordering the old code could not survive: pointerleave BEFORE pointerup.
  // On touch the finger "leaves" as it lifts, and the previous version cleared
  // its drag state there, discarding the tap.
  const s5 = probe.pointScreenPos();
  const X = r.left + s5.x, Y = r.top + s5.y;
  const base = { bubbles: true, cancelable: true, composed: true,
                 pointerId: 77, pointerType: 'touch', isPrimary: true, button: 0 };
  cv.dispatchEvent(new win.PointerEvent('pointerdown', { ...base, clientX: X, clientY: Y, buttons: 1 }));
  cv.dispatchEvent(new win.PointerEvent('pointerleave', { ...base, clientX: X, clientY: Y, buttons: 0 }));
  cv.dispatchEvent(new win.PointerEvent('pointerup',    { ...base, clientX: X, clientY: Y, buttons: 0 }));
  cv.dispatchEvent(new win.MouseEvent('click',
    { bubbles: true, cancelable: true, composed: true, clientX: X, clientY: Y, button: 0 }));
  await sleep(1200);
  say(isOpen() ? 'PASS' : 'FAIL',
      `tap survives pointerleave arriving before pointerup (open=${isOpen()})`);
  doc.querySelector('.drawer .close').click();
  await sleep(700);

  // ---------------- pinch to zoom ----------------
  const pe = (type, id, x, y, buttons) => cv.dispatchEvent(new win.PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true, pointerId: id, pointerType: 'touch',
    isPrimary: id === 11, button: 0, buttons, clientX: x, clientY: y }));

  const before = probe.state().s;
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  pe('pointerdown', 11, cx - 40, cy, 1);
  pe('pointerdown', 12, cx + 40, cy, 1);
  for (let k = 1; k <= 6; k++) {
    const spread = 40 + k * 25;
    win.dispatchEvent(new win.PointerEvent('pointermove', { bubbles: true, pointerId: 11,
      pointerType: 'touch', clientX: cx - spread, clientY: cy, buttons: 1 }));
    win.dispatchEvent(new win.PointerEvent('pointermove', { bubbles: true, pointerId: 12,
      pointerType: 'touch', clientX: cx + spread, clientY: cy, buttons: 1 }));
  }
  const during = probe.state().s;
  win.dispatchEvent(new win.PointerEvent('pointerup', { bubbles: true, pointerId: 11, pointerType: 'touch', buttons: 0 }));
  win.dispatchEvent(new win.PointerEvent('pointerup', { bubbles: true, pointerId: 12, pointerType: 'touch', buttons: 0 }));
  await sleep(400);
  say(during > before * 1.5 ? 'PASS' : 'FAIL',
      `pinch out zooms in (scale ${before} -> ${during})`);
  say(!isOpen() ? 'PASS' : 'FAIL', `a pinch does not open the panel (open=${isOpen()})`);

  // pinch in should shrink it back
  const beforeIn = probe.state().s;
  pe('pointerdown', 21, cx - 180, cy, 1);
  pe('pointerdown', 22, cx + 180, cy, 1);
  for (let k = 1; k <= 6; k++) {
    const spread = 180 - k * 25;
    win.dispatchEvent(new win.PointerEvent('pointermove', { bubbles: true, pointerId: 21,
      pointerType: 'touch', clientX: cx - spread, clientY: cy, buttons: 1 }));
    win.dispatchEvent(new win.PointerEvent('pointermove', { bubbles: true, pointerId: 22,
      pointerType: 'touch', clientX: cx + spread, clientY: cy, buttons: 1 }));
  }
  const afterIn = probe.state().s;
  win.dispatchEvent(new win.PointerEvent('pointerup', { bubbles: true, pointerId: 21, pointerType: 'touch', buttons: 0 }));
  win.dispatchEvent(new win.PointerEvent('pointerup', { bubbles: true, pointerId: 22, pointerType: 'touch', buttons: 0 }));
  await sleep(400);
  say(afterIn < beforeIn ? 'PASS' : 'FAIL', `pinch in zooms out (${beforeIn} -> ${afterIn})`);

  // ---------------- a tap still works after a pinch ----------------
  const s6 = probe.pointScreenPos();
  if (s6) {
    tap(win, cv, r.left + s6.x, r.top + s6.y);
    await sleep(1200);
    say(isOpen() ? 'PASS' : 'FAIL',
        `a tap after a pinch still opens the panel (open=${isOpen()})  <-- stuck-suppression check`);
    doc.querySelector('.drawer .close').click();
    await sleep(600);
  } else {
    say('INFO', 'no point in view after the pinch to tap');
  }

  // ---------------- geolocation ----------------
  // Stub the API so the test is deterministic and never prompts.
  const fakeAt = (lat, lon) => {
    Object.defineProperty(win.navigator, 'geolocation', {
      configurable: true,
      value: { getCurrentPosition: (ok) => setTimeout(() =>
        ok({ coords: { latitude: lat, longitude: lon, accuracy: 30 } }), 30) },
    });
  };

  fakeAt(38.0406, -84.5037);                    // downtown Lexington
  doc.getElementById('locate').click();
  await sleep(1200);
  const msg1 = doc.getElementById('locmsg');
  say(!msg1.hidden && /Centred on your location/i.test(msg1.textContent) ? 'PASS' : 'FAIL',
      `locating in Lexington centres the map`);
  say(!doc.getElementById('nearbox').hidden ? 'PASS' : 'FAIL', `nearest establishments are listed`);
  say(probe.state().s > 1 ? 'PASS' : 'FAIL', `locating zooms in (s=${probe.state().s})`);
  const first = doc.querySelector('.nearlist button .mt');
  say('INFO', `closest: ${doc.querySelector('.nearlist button .nm')?.textContent} — ${first?.textContent}`);

  fakeAt(40.7128, -74.0060);                    // New York — well off the map
  doc.getElementById('locate').click();
  await sleep(1200);
  say(/outside Fayette County/i.test(doc.getElementById('locmsg').textContent) ? 'PASS' : 'FAIL',
      `a location outside the county says so rather than failing`);

  Object.defineProperty(win.navigator, 'geolocation', {
    configurable: true,
    value: { getCurrentPosition: (_ok, err) => setTimeout(() => err({ code: 1 }), 30) },
  });
  doc.getElementById('locate').click();
  await sleep(1000);
  say(/permission was denied/i.test(doc.getElementById('locmsg').textContent) ? 'PASS' : 'FAIL',
      `a denied permission explains itself`);

  render();
})();
</script>
</body>
</html>
